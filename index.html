<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MyGallery</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#f6f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}header{padding:20px 18px 12px;position:sticky;top:0;z-index:5;background:#0b0d12ee;backdrop-filter:blur(14px)}h1{margin:0;font-size:28px}.sub{color:#8d96a8;font-size:13px;margin-top:4px}.tabs{display:flex;gap:8px;padding:10px 18px;overflow:auto}.tabs button{border:0;border-radius:14px;padding:9px 14px;background:#171a22;color:#b9c0cf}.tabs .active{background:#fff;color:#111}.content{padding:8px 18px 100px}.row{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px}.row h2{margin:0;font-size:18px}.btn{border:0;border-radius:12px;padding:9px 13px;background:#171a22;color:#fff}.folders{display:flex;gap:10px;overflow:auto}.folder{min-width:126px;padding:14px;border:1px solid #252a37;border-radius:16px;background:#151821;color:#fff;cursor:pointer}.folder b{display:block;margin-top:8px}.folder small{display:block;margin-top:2px;color:#7f8798}.empty{padding:42px 20px;text-align:center;color:#7f8798;border:1px dashed #292e39;border-radius:18px}.fab{position:fixed;right:20px;bottom:22px;width:58px;height:58px;border:0;border-radius:50%;font-size:30px;background:#fff;color:#111}.modal{display:none;position:fixed;inset:0;z-index:10;background:#0009;align-items:flex-end}.sheet{width:100%;padding:20px;background:#151821;border-radius:24px 24px 0 0}.sheet h2{margin:0}.sheet input,.sheet select{width:100%;margin:12px 0;padding:14px;border:1px solid #303544;border-radius:12px;background:#0d1016;color:#fff}.close{float:right;border:0;border-radius:10px;padding:8px 12px;background:#292e3b;color:#fff}.upload{border:0;border-radius:12px;padding:12px 18px;background:#fff;color:#111}.status{margin-top:12px;font-size:13px;color:#8d96a8}.media{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.media .tile{aspect-ratio:1;border-radius:16px;background:#151821;border:1px solid #252a37;display:flex;align-items:center;justify-content:center;color:#8d96a8}
</style></head><body>
<header><h1>MyGallery</h1><div class="sub">Private photo & video library</div></header>
<nav class="tabs"><button class="active">All</button><button>Photos</button><button>Videos</button></nav>
<main class="content"><section><div class="row"><h2>Folders</h2><button class="btn" onclick="openFolderModal()">＋ New</button></div><div class="folders" id="folders"><div class="folder" onclick="selectFolder('Family')">📁<b>Family</b><small>0 items</small></div><div class="folder" onclick="selectFolder('Friends')">📁<b>Friends</b><small>0 items</small></div><div class="folder" onclick="selectFolder('Travel')">📁<b>Travel</b><small>0 items</small></div></div></section>
<section><div class="row"><h2 id="mediaTitle">Media</h2><button class="btn" onclick="openUploadModal()">＋ Upload</button></div><div class="media"><div class="tile">🖼️<br>No media yet</div></div></section></main>
<button class="fab" onclick="openUploadModal()">＋</button>
<div class="modal" id="folderModal"><div class="sheet"><button class="close" onclick="closeModals()">Close</button><h2>Create folder</h2><input id="folderName" placeholder="Folder name"><button class="upload" onclick="addFolder()">Create folder</button></div></div>
<div class="modal" id="uploadModal"><div class="sheet"><button class="close" onclick="closeModals()">Close</button><h2>Upload to Telegram</h2><select id="folderSelect"><option>Family</option><option>Friends</option><option>Travel</option><option>Other</option></select><input id="file" type="file" accept="image/*,video/*" multiple><button class="upload" onclick="uploadFiles()">Upload</button><div class="status" id="status"></div></div></div>
<script>
const API_BASE='';let selectedFolder='All';
function openFolderModal(){document.getElementById('folderModal').style.display='flex';document.getElementById('folderName').focus()}function openUploadModal(){document.getElementById('uploadModal').style.display='flex'}function closeModals(){document.querySelectorAll('.modal').forEach(x=>x.style.display='none')}
function selectFolder(name){selectedFolder=name;document.getElementById('mediaTitle').textContent=name+' Media'}
function addFolder(){const n=document.getElementById('folderName').value.trim();if(!n)return;const el=document.createElement('div');el.className='folder';el.onclick=()=>selectFolder(n);el.innerHTML='📁<b></b><small>0 items</small>';el.querySelector('b').textContent=n;document.getElementById('folders').appendChild(el);document.getElementById('folderName').value='';closeModals()}
async function uploadFiles(){const input=document.getElementById('file'),files=[...input.files],folder=document.getElementById('folderSelect').value,status=document.getElementById('status');if(!files.length){status.textContent='Choose at least one photo or video.';return}status.textContent='Uploading...';let ok=0;for(const file of files){try{const fd=new FormData();fd.append('file',file);fd.append('folder',folder);const r=await fetch(API_BASE+'/api/upload',{method:'POST',body:fd});if(!r.ok)throw new Error('upload failed');ok++}catch(e){status.textContent=`Uploaded ${ok}/${files.length}. Backend is not connected yet.`;return}}status.textContent=`Uploaded ${ok} file(s) to Telegram.`;input.value=''}
</script></body></html>
