<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>MyGallery</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#f6f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}header{padding:20px 18px 12px;position:sticky;top:0;z-index:5;background:#0b0d12ee;backdrop-filter:blur(14px)}h1{margin:0;font-size:28px}.sub{color:#8d96a8;font-size:13px;margin-top:4px}.tabs{display:flex;gap:8px;padding:10px 18px;overflow:auto}.tabs button{border:0;border-radius:14px;padding:9px 14px;background:#171a22;color:#b9c0cf}.tabs .active{background:#fff;color:#111}.content{padding:8px 18px 100px}.row{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px}.row h2{margin:0;font-size:18px}.btn{border:0;border-radius:12px;padding:9px 13px;background:#171a22;color:#fff}.folders{display:flex;gap:10px;overflow:auto;padding-bottom:3px}.folder{min-width:126px;padding:14px;border:1px solid #252a37;border-radius:16px;background:#151821;color:#fff;cursor:pointer}.folder b{display:block;margin-top:8px}.folder small{display:block;margin-top:2px;color:#7f8798}.empty{padding:42px 20px;text-align:center;color:#7f8798;border:1px dashed #292e39;border-radius:18px}.fab{position:fixed;right:20px;bottom:22px;width:58px;height:58px;border:0;border-radius:50%;font-size:30px;background:#fff;color:#111;box-shadow:0 8px 30px #0008}.modal{display:none;position:fixed;inset:0;z-index:10;background:#0009;align-items:flex-end}.sheet{width:100%;padding:20px;background:#151821;border-radius:24px 24px 0 0;max-height:85vh;overflow:auto}.sheet h2{margin:0}.sheet input,.sheet select{width:100%;margin:12px 0;padding:14px;border:1px solid #303544;border-radius:12px;background:#0d1016;color:#fff}.close{float:right;border:0;border-radius:10px;padding:8px 12px;background:#292e3b;color:#fff}.upload{border:0;border-radius:12px;padding:12px 18px;background:#fff;color:#111}.status{margin-top:12px;font-size:13px;color:#8d96a8}.media{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tile{aspect-ratio:1;border-radius:16px;background:#151821;border:1px solid #252a37;display:flex;align-items:center;justify-content:center;color:#8d96a8;overflow:hidden;position:relative}.tile img,.tile video{width:100%;height:100%;object-fit:cover}.tile .tag{position:absolute;left:7px;bottom:7px;background:#000b;border-radius:8px;padding:4px 7px;font-size:11px;color:#fff}.hidden{display:none}
</style>
</head>
<body>
<header><h1>MyGallery</h1><div class="sub">Private photo & video library</div></header>
<nav class="tabs" id="tabs"><button class="active" data-filter="all">All</button><button data-filter="image">Photos</button><button data-filter="video">Videos</button></nav>
<main class="content">
<section><div class="row"><h2>Folders</h2><button class="btn" onclick="openFolderModal()">＋ New</button></div><div class="folders" id="folders"><div class="folder" onclick="selectFolder('Family')">📁<b>Family</b><small>0 items</small></div><div class="folder" onclick="selectFolder('Friends')">📁<b>Friends</b><small>0 items</small></div><div class="folder" onclick="selectFolder('Travel')">📁<b>Travel</b><small>0 items</small></div></div></section>
<section><div class="row"><h2 id="mediaTitle">Media</h2><button class="btn" onclick="openUploadModal()">＋ Upload</button></div><div class="media" id="media"><div class="empty" id="empty">🖼️<br><br>No media yet.<br><small>Select photos or videos to preview them here.</small></div></div></section>
</main>
<button class="fab" onclick="openUploadModal()">＋</button>
<div class="modal" id="folderModal"><div class="sheet"><button class="close" onclick="closeModals()">Close</button><h2>Create folder</h2><input id="folderName" maxlength="40" placeholder="Folder name"><button class="upload" onclick="addFolder()">Create folder</button></div></div>
<div class="modal" id="uploadModal"><div class="sheet"><button class="close" onclick="closeModals()">Close</button><h2>Upload to Telegram</h2><select id="folderSelect"><option>Family</option><option>Friends</option><option>Travel</option><option>Other</option></select><input id="file" type="file" accept="image/*,video/*" multiple><button class="upload" onclick="previewAndUpload()">Add & Upload</button><div class="status" id="status"></div></div></div>
<script>
// Set this after deploying telegram-backend/worker.js. Never put BOT_TOKEN here.
const API_BASE=window.MYGALLERY_API||'';
let selectedFolder='All',currentFilter='all';
const $=id=>document.getElementById(id);
function openFolderModal(){$('folderModal').style.display='flex';$('folderName').focus()}
function openUploadModal(){$('uploadModal').style.display='flex'}
function closeModals(){document.querySelectorAll('.modal').forEach(x=>x.style.display='none')}
function selectFolder(name){selectedFolder=name;$('mediaTitle').textContent=name+' Media'}
function addFolder(){const n=$('folderName').value.trim();if(!n)return;const el=document.createElement('div');el.className='folder';el.onclick=()=>selectFolder(n);el.innerHTML='📁<b></b><small>0 items</small>' ;el.querySelector('b').textContent=n;$('folders').appendChild(el);$('folderName').value='';closeModals()}
function addPreview(file,folder){$('empty')?.remove();const tile=document.createElement('div');tile.className='tile';tile.dataset.type=file.type.startsWith('video/')?'video':'image';tile.dataset.folder=folder;const tag=document.createElement('div');tag.className='tag';tag.textContent=folder;if(file.type.startsWith('video/')){const v=document.createElement('video');v.src=URL.createObjectURL(file);v.muted=true;v.playsInline=true;tile.append(v)}else{const img=document.createElement('img');img.src=URL.createObjectURL(file);img.alt=file.name;tile.append(img)}tile.append(tag);$('media').prepend(tile);applyFilter()}
async function previewAndUpload(){const input=$('file'),files=[...input.files],folder=$('folderSelect').value,status=$('status');if(!files.length){status.textContent='Choose at least one photo or video.';return}files.forEach(f=>addPreview(f,folder));if(!API_BASE){status.textContent='Preview added. Telegram backend URL is not configured yet.';return}status.textContent='Uploading 0/'+files.length+'...';let ok=0;for(const file of files){try{const fd=new FormData();fd.append('file',file);fd.append('folder',folder);const r=await fetch(API_BASE.replace(/\/$/,'')+'/api/upload',{method:'POST',body:fd});if(!r.ok)throw new Error('upload failed');ok++;status.textContent='Uploading '+ok+'/'+files.length+'...'}catch(e){status.textContent='Uploaded '+ok+'/'+files.length+'. Check the backend URL or file size.';return}}status.textContent='Uploaded '+ok+' file(s) to Telegram.';input.value=''}
function applyFilter(){document.querySelectorAll('.tile').forEach(t=>{t.classList.toggle('hidden',currentFilter!=='all'&&t.dataset.type!==currentFilter)})}
document.querySelectorAll('#tabs button').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('#tabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');currentFilter=btn.dataset.filter;applyFilter()}));
</script>
</body>
</html>
